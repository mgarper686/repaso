<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Miguel García Pérez">
<title>Concurso de armonía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Escenario de concurso: fondo de sala oscuro, partituras sobre "papel" blanco, respuestas en seis colores con forma */
:root{
  --stage:#0c262e; --stage2:#123843; --stage3:#1a4a57; --line:#2c6070;
  --text:#eef6f7; --muted:#a3c4cb; --paper:#ffffff; --ink:#15282e;
  --accent:#f4a53a; --ok:#2fb56a; --ko:#e2553f;
  --c0:#d9443c; --c1:#2c6ed4; --c2:#d4920a; --c3:#22935a; --c4:#8a52c6; --c5:#11808a;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Trebuchet MS',Verdana,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--stage);color:var(--text);font:17px/1.45 var(--f-body);
  background-image:radial-gradient(1200px 600px at 85% -10%,var(--stage3),transparent 60%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.025) 23px 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:1400px;margin:0 auto;padding-block:14px 28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-body);font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.btn{border:2px solid var(--line);background:var(--stage2);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;line-height:1.15;transition:transform .1s,background .15s}
.btn:hover{background:var(--stage3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2a1700}
.btn.primary:hover{background:#ffb653}
.btn.big{font-size:1.25rem;padding:14px 26px;border-radius:14px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.card{background:var(--stage2);border:1px solid var(--line);border-radius:20px;padding:20px}
.paper{background:var(--paper);color:var(--ink);border-radius:16px;padding:6px 10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.paper svg{display:block;width:100%;height:auto;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--stage3);border-radius:999px;padding:5px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.soft{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.warn{background:rgba(244,165,58,.14);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:.95rem}
/* cifrados */
.fg{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;margin-left:.12em;font-size:.66em;position:relative;top:-.08em}
.fg b{font-weight:700}
.sl{position:relative;display:inline-block;font-style:normal;padding:0 .08em}
.sl::after{content:'';position:absolute;left:50%;top:14%;height:72%;border-left:.1em solid currentColor;transform:rotate(36deg)}
/* inicio */
.home{display:grid;gap:22px;padding-top:4vh}
.home h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800;line-height:1}
.home .lead{max-width:62ch;color:var(--muted);margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.role{display:grid;gap:10px;align-content:start}
.role h2{font-size:1.5rem}
.role p{margin:0;color:var(--muted)}
/* toasts */
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:6px;z-index:90;width:min(92vw,520px);pointer-events:none}
#toasts div{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:700;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ===== pantalla de clase ===== */
.lobby{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.join{display:grid;gap:10px;justify-items:center;text-align:center}
.qr{background:#fff;border-radius:14px;padding:10px;width:100%;max-width:330px}
.qr svg{display:block;width:100%;height:auto}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;word-break:break-all;margin:0;color:var(--muted)}
.bigcode{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,8vw,5.4rem);letter-spacing:.12em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.setup{display:grid;gap:18px;min-width:0}
.setup .title{font-size:clamp(2rem,4.4vw,3.4rem);font-weight:800;line-height:1.02}
.setup .title small{display:block;font-family:var(--f-body);font-size:.36em;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:8px}
.opt{display:grid;gap:6px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700}
.segb.on{background:var(--text);color:var(--stage);border-color:var(--text)}
.opt small{color:var(--muted)}
.players{display:flex;flex-wrap:wrap;gap:10px;min-height:64px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--stage3);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pchip small{font-weight:400;color:var(--muted)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.empty{color:var(--muted);font-style:italic;align-self:center}
/* pregunta */
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.host .qbar{padding-right:0;padding-top:46px}
@media (max-width:860px){.host .qbar{padding-right:0;padding-top:44px}}
.host .setup{padding-top:34px}
.room{font-variant-numeric:tabular-nums;color:var(--muted)}
.room b{color:var(--accent);font-size:1.15em;letter-spacing:.06em}
.qhead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.prompt{font-size:clamp(1.6rem,3.2vw,2.7rem);font-weight:700;line-height:1.12}
.prompt .sub{font-family:var(--f-body);font-weight:400;font-size:.62em;color:var(--muted)}
.ring{position:relative;width:110px;height:110px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--ko)}
.qvis{max-width:620px;margin:0 auto 18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;align-items:center;gap:14px;border:0;border-radius:14px;padding:16px 18px;color:#fff;text-align:left;font-weight:700;font-size:clamp(1.05rem,1.9vw,1.6rem);line-height:1.2;min-height:76px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);min-width:0}
.tile span{min-width:0;overflow-wrap:anywhere}
.tile small{display:block;font-weight:400;font-size:.62em;opacity:.92;margin-top:3px}
.tile .shp{font-style:normal;font-size:1.5em;line-height:1;width:1.2em;text-align:center;flex:none;opacity:.95}
.tile em{margin-left:auto;font-style:normal;font-family:var(--f-display);font-size:1.4em;font-variant-numeric:tabular-nums;padding-left:10px}
.t0{background:var(--c0)}.t1{background:var(--c1)}.t2{background:var(--c2)}.t3{background:var(--c3)}.t4{background:var(--c4)}.t5{background:var(--c5)}
.tile.dim{opacity:.28}
.tile.right{outline:4px solid #fff;outline-offset:3px}
.tile.right::after{content:'✔';position:absolute;right:-10px;top:-12px;background:var(--ok);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:1.1rem;border:3px solid var(--stage)}
.buildnote{text-align:center;font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,2rem);font-weight:700;margin:6px 0 0}
.qfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.answered{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.answered b{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
.avrow{display:flex;flex-wrap:wrap;gap:4px}
.exp{background:var(--stage2);border-left:6px solid var(--accent);border-radius:12px;padding:12px 16px;margin:16px 0 0;font-size:1.15rem;max-width:80ch}
.sol{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:20px;align-items:center}
@media (max-width:760px){.sol{grid-template-columns:1fr}}
.solstat b{font-family:var(--f-display);font-size:3rem;color:var(--ok);line-height:1}
/* clasificación */
.rank{display:grid;gap:8px;max-width:900px;margin:0 auto}
.rank h1{font-size:clamp(2rem,4vw,3rem);text-align:center;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:3.2rem auto 1fr auto auto;gap:14px;align-items:center;background:var(--stage2);border:1px solid var(--line);border-radius:14px;padding:8px 16px;animation:rin .4s ease-out both}
.rrow .pos{font-family:var(--f-display);font-weight:800;font-size:1.8rem;text-align:center;font-variant-numeric:tabular-nums}
.rrow .nm{font-weight:700;font-size:1.3rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .nm small{display:block;font-weight:400;font-size:.7em;color:var(--muted)}
.rrow .sc{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.rrow .dl{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.rrow.top1{border-color:var(--accent);background:linear-gradient(90deg,rgba(244,165,58,.22),var(--stage2))}
.mv{font-size:.8rem;margin-left:4px}.mv.up{color:var(--ok)}.mv.dn{color:var(--ko)}
@keyframes rin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* podio */
.end{display:grid;gap:22px;justify-items:center;position:relative;overflow:hidden;padding-top:10px}
.end h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800}
.pdrow{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:14px;align-items:end;width:100%;justify-content:center}
.pd{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.pd b{font-size:1.25rem;overflow-wrap:anywhere}
.pd span{color:var(--muted);font-variant-numeric:tabular-nums}
.pdbox{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2.4rem;color:#2a1700}
.p1 .pdbox{height:170px;background:var(--accent)}.p2 .pdbox{height:120px;background:#c9d6da}.p3 .pdbox{height:90px;background:#d79a62}
.pdav{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}.p1 .pdav{animation-delay:.9s}.p2 .pdav{animation-delay:.5s}.p3 .pdav{animation-delay:.2s}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;width:100%}
.team{display:flex;flex-wrap:wrap;gap:8px;align-content:start;background:var(--stage2);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:10px;min-width:0}
.team h3{width:100%;font-size:1.1rem;color:var(--text)}
.team h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);margin-left:4px}
.team .pchip{cursor:pointer}
.team .pchip:hover{outline:2px solid var(--tc)}
.trow{border-left:10px solid var(--tc)}
.avstack{display:flex;align-items:center;padding-left:10px}
.avstack svg{margin-left:-10px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.tbadge{display:inline-block;background:var(--tc);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px}
.tpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tpick button{border:3px solid transparent;background:var(--tc);color:#fff;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;text-align:left}
.tpick button small{display:block;font-weight:400;opacity:.9}
.tpick button[aria-checked="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.hintb{width:100%;display:grid;gap:2px;justify-items:center;border-style:dashed}
.hintb small{font-weight:400;color:var(--muted)}
.hintbox{background:rgba(244,165,58,.14);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0}
.resume{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-color:var(--accent)}
.resume h2{font-size:1.5rem}
.qrov{position:fixed;inset:0;z-index:60;background:rgba(5,20,25,.82);display:grid;place-items:center;padding:16px}
.qrov .card{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto}
#endb.arm{background:var(--ko);border-color:var(--ko);color:#fff}
.qr.blurred{position:relative}
.qr.blurred svg{filter:blur(14px)}
.qr.blurred .btn{position:absolute;inset:auto 0 0;margin:auto;top:0;width:max-content;height:max-content;left:0;right:0}
.answerbox{display:grid;gap:8px;background:var(--stage2);border:2px solid var(--ok);border-radius:16px;padding:12px}
.big-ans{font-family:var(--f-display);font-size:1.6rem;font-weight:800;margin:0;text-align:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--accent);font-size:1.2em}
.bigfig{font-size:1.9em;line-height:1}
.tile.gone{opacity:.18;filter:grayscale(1);cursor:default}
.streak{font-weight:700;color:var(--accent);margin:0;font-size:1.15rem}
.rules{margin:0;color:var(--muted);max-width:70ch}
.rrow .dl small.bn{display:block;font-size:.75rem;color:var(--accent)}

/* pantalla completa */
.tools{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px);position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:6px}
.tools .btn{font-size:.85rem;padding:6px 10px;background:var(--stage)}
/* ===== móvil ===== */
.phone{max-width:560px;margin:0 auto;display:grid;gap:14px}
.phone h1{font-size:1.9rem;font-weight:800}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:700}
.field input{font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--stage);color:var(--text);width:100%}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;justify-items:center}
.avpick button{position:relative;border:3px solid transparent;background:transparent;border-radius:50%;padding:2px;cursor:pointer;line-height:0}
.avpick button[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.avpick button.taken{opacity:.35;filter:grayscale(.9);cursor:not-allowed}
.avpick .lk{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:14px;line-height:1}
.avcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.avcard b{font-size:1.15rem}
.avcard small{display:block;color:var(--muted)}
.avcard p{margin:4px 0 0;font-size:.95rem}
.avcard .avmel{color:var(--accent);margin-top:4px}
.avbig{position:relative;line-height:0}
.avcard.pop .avbig svg{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.nt{position:absolute;left:38px;top:30px;font-style:normal;font-size:20px;line-height:1;color:var(--accent);opacity:0;pointer-events:none;animation:nfly 1.3s ease-out forwards}
.nt.n1{--dx:-34px;--dy:-46px}.nt.n2{--dx:30px;--dy:-52px;animation-delay:.08s;color:#ff7a6e}.nt.n3{--dx:-40px;--dy:-12px;animation-delay:.16s;color:#5fd59a}.nt.n4{--dx:36px;--dy:-14px;animation-delay:.22s;color:#c49bff}
@keyframes nfly{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.avcred{font-size:.85rem;color:var(--muted)}
.avcred summary{cursor:pointer}
.avcred a{color:var(--muted)}
.msg{min-height:1.4em;color:var(--accent);font-weight:700;margin:0}
.ptop{display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:6px;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar{height:10px;border-radius:6px;background:var(--stage3);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#ffd07a);transition:width .25s linear}
.pprompt{font-size:1.2rem;font-weight:700;margin:0}
.pprompt .sub{font-weight:400;color:var(--muted);font-size:.85em}
.ptiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ptiles .tile{font-size:1.15rem;min-height:92px;cursor:pointer;padding:12px}
.ptiles .tile:active{transform:scale(.97)}
.ptiles.one{grid-template-columns:1fr}
.bank{display:grid;gap:6px}
.bank svg,.tgt svg{display:block;width:100%;height:auto;touch-action:manipulation}
.bank [data-n],.tgt [data-p]{cursor:pointer}
.tgt{border-radius:16px}
.center{text-align:center;justify-items:center}
.state{display:grid;gap:12px;justify-items:center;text-align:center;padding:26px 16px}
.state h2{font-size:1.8rem}
.verdict{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}
.plus{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--accent)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats div{background:var(--stage2);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--f-display);font-size:1.6rem}
.wiggle{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.nt,.conf{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// Retratos de compositores y compositoras (dibujos propios, viewBox 0 0 100 100)
(function(){
const SK={light:['#f3d3b6','#d9a888','#c98d72'],fair:['#f6dcc6','#e0b49a','#cf977d'],olive:['#e6bf98','#c99a73','#b07e5b'],dark:['#8a5a3c','#6d4329','#5a3520'],ruddy:['#eec3a4','#d39a7c','#bf8064'],pale:['#f8e4d4','#e6c2aa','#d4a68c']};
const OUT={

function mk(L0,pc0,t,inv){let s0=28+L0;if(s0>33)s0-=7;const ns=IVL[t].map(([o,st],j)=>{const L=(L0+o)%7,pc=(pc0+st)%12;let a=(pc-NP[L]+12)%12;if(a>6)a-=12;const d=DG[t][j];return{L,a,s:s0+o,j,d,role:d==7?'s':j==3?'7':j==4?'9':'b'}});
for(let j=0;j<inv;j++)ns[j].s+=7;ns.sort((a,b)=>a.s-b.s);ns.forEach(n=>n.m=12*(Math.floor(n.s/7)+1)+NP[n.L]+n.a);return ns}
function tgt(k,d){const K=KEYS[k];return{T:deg(K,d,0),pc:(K.pc+NP[d-1])%12,mi:[2,3,6].includes(d)}}
const sd=(k,d,t,i)=>{const g=tgt(k,d);return t<4?mk((g.T.L+4)%7,(g.pc+7)%12,t,i):mk((g.T.L+6)%7,(g.pc+11)%12,t,i)},
am=(ns,t,i)=>an(ns.find(n=>n.j==0))+AQ[t]+(i?'/'+an(ns[0]):''),tn=(k,d)=>{const g=tgt(k,d);return an(g.T)+(g.mi?'m':'')};
function nt(L,pc){L%=7;let a=((pc%12)-NP[L]+12)%12;if(a>6)a-=12;return{L,a}}
function resT(ns,k,d){const g=tgt(k,d),T=g.T,tn={1:{L:T.L,a:T.a},3:nt(T.L+2,g.pc+(g.mi?3:4)),5:nt(T.L+4,g.pc+7)},mv={7:[1,1],4:[3,-1],6:[5,-1],5:[5,0]},has3=ns.some(n=>n.d==4),u=[];
ns.forEach(n=>{let q,ds;if(n.d==2){q=has3?1:3;ds=has3?-1:1}else[q,ds]=mv[n.d];const b=tn[q],s=n.s+ds;let z=u.find(z=>z.s==s);
if(!z){z={L:b.L,a:b.a,s,m:12*(Math.floor(s/7)+1)+NP[b.L]+b.a,role:'b',srcs:[]};u.push(z)}z.srcs.push(n)});return u.sort((a,b)=>a.s-b.s)}
const asg=(k,L)=>{const sg=KEYS[k].sg;return sg>0?([3,0,4,1,5,2,6].slice(0,sg).includes(L)?1:0):sg<0?([6,2,5,1,4,0,3].slice(0,-sg).includes(L)?-1:0):0};
function pool2(k,d,t,lv,inv){const ex=sd(k,d,t,0),s0=ex[0].s,p=[],add=(L,a,s)=>{if(Math.abs(a)<=2&&!p.some(x=>x.s==s&&x.a==a))p.push({L,a,s})};
for(let j=0;j<5;j++){const o=j<inv?7:0,s=s0+2*j+o,L=s%7,e=ex[j];
if(e){add(L,e.a,s);if(o)add(L,e.a,s-7);const ds=asg(k,L);if(ds!=e.a)add(L,ds,s);if(lv>=2||(lv==1&&e.role!='b'))add(L,e.a>-1?e.a-1:e.a+1,s)}
else{add(L,asg(k,L),s);if(lv>=2)add(L,asg(k,L)+1,s)}}
return p.map((n,i)=>({...n,id:i,m:12*(Math.floor(n.s/7)+1)+NP[n.L]+n.a}))}

const TH=[

['La función de dominante se opone a la de tónica. ¿Qué representa cada una?',['Dominante: tensión · Tónica: reposo','Dominante: reposo · Tónica: tensión','Las dos son reposo'],'La dominante genera inestabilidad y la tónica la resuelve.'],

['La séptima de sensible equivale a…',['un V9 sin fundamental','un V♭9 sin fundamental','un V7 con la 5.ª aumentada'],'La séptima disminuida es la que equivale a V♭9 sin fundamental.'],
['En modo menor, ¿qué hay que hacer con la 7.ª nota de la escala para formar la dominante?',['Subirla medio tono (alterar la sensible)','Dejarla como está en la armadura','Bajarla medio tono'],'Sin sensible no hay función de dominante: la alteración se escribe en la partitura.'],
['La dominante de una tonalidad menor coincide con…',['la dominante del modo mayor homónimo','la subdominante del mayor','la dominante del relativo mayor'],'Al alterar la sensible, el V (y el VII) son iguales que en el mayor del mismo nombre.'],
['¿Cómo resuelve la novena menor del acorde de dominante?',['Desciende a la 5.ª del acorde de I','Asciende a la 3.ª de I','Se queda quieta'],'La novena baja un grado hasta la quinta de la tónica.'],
['¿Qué notas de la escala forman la séptima disminuida de sensible?',['7.ª, 2.ª, 4.ª y 6.ª rebajada','7.ª, 2.ª, 4.ª y 6.ª','5.ª, 7.ª, 2.ª y 4.ª'],'Es la séptima de sensible con el 6.º grado rebajado.'],
['En modo menor, ¿qué acordes de la gama de dominante desaparecen?',['La novena mayor y la séptima de sensible','La séptima de dominante y la novena menor','Ninguno'],'Ambos necesitan el 6.º grado mayor, que en menor está rebajado.'],
['¿Qué acorde de dominante aparece en modo menor con el 6.º grado ya rebajado?',['La novena menor (V♭9)','La novena mayor (V9)','La séptima de sensible'],'En menor el 6.º grado es naturalmente menor, así que encaja la novena menor.'],
['La tríada de sensible equivale a…',['un V7 sin fundamental','un V9 sin fundamental','un V con la 5.ª aumentada'],'Quitando la fundamental al V7 quedan la sensible, el 2.º y el 4.º grados: la tríada de sensible.'],
['¿Qué intervalo hay entre la fundamental del V y la sensible?',['Una 3.ª mayor','Una 3.ª menor','Una 5.ª justa'],'La sensible es la tercera del V, y es mayor: por eso los acordes de sensible son un V sin fundamental.'],

function stf(ns,ki,col,W){W=W||340;const x=cxOf(ns,ki,W);return `<svg viewBox="0 46 ${W} 160" role="img" aria-label="Acorde en el pentagrama">${base(ki,W)}${notes(ns,x,sigOf(ki),n=>col?COL[n.role]:COL.b)}</svg>`}

/* ---------- preguntas (sin acordes de novena) ---------- */
const TA=[0,1,4,5,6];   /* V, V7, VII, VII7 (semidisminuida), VII7 disminuida */
const OKK=KEYS.map((k,i)=>i).filter(i=>Math.abs(KEYS[i].sg)<=4);
const THF=TH.filter((_,i)=>![7,10,12,13].includes(i));   /* fuera las de teoría que tratan la novena */
const SHAPES=['▲','◆','●','■','★','⬟'];
const BANKN={A:'Acorde de dominante',B:'Dominantes secundarias'};
const QT={c1:60,c2:120,i1:25,i2:25,f2:25,n2:20,t:20,z:20};
const qSrc=q=>(q.ty=='c1'||q.ty=='i1'||q.ty=='t')?'A':'B';
const isBuild=q=>q.ty=='c1'||q.ty=='c2';
function pickA(used){for(let n=0;n<300;n++){const ki=OKK[rnd(OKK.length)],ts=TA.filter(t=>avail(ki,t)),ti=ts[rnd(ts.length)],key=ki+','+ti;if(!used.has(key)){used.add(key);return[ki,ti]}}const ki=OKK[rnd(OKK.length)];return[ki,1]}
function pkB(t,used){const f=()=>{const c=[];for(let k=0;k<15;k++)if(Math.abs(KEYS[k].sg)<=4)for(let d=2;d<=6;d++){if(used.has(k+'-'+d))continue;const ns=sd(k,d,t,0);if(ns.concat(resT(ns,k,d)).every(n=>Math.abs(n.a)<=2))c.push([k,d])}return c};
  let c=f();if(!c.length){used.clear();c=f()}const x=c[rnd(c.length)];used.add(x[0]+'-'+x[1]);return x}
function genQuiz(bank,N){
  const PA=['c1','c1','c1','c1','i1','i1','i1','t','t','t'],PB=['c2','c2','c2','c2','i2','i2','n2','n2','f2','f2','z'];
  const pat=bank=='A'?PA:bank=='B'?PB:PA.concat(PB);let bag=[];while(bag.length<N*3)bag=bag.concat(shf(pat));
  const uA=new Set(),uB=new Set(),th=shf(THF),qz=shf(QZ);let ti=0,zi=0;const out=[];
  for(const ty of bag){if(out.length>=N)break;let q=null;
    if(out.length&&out[out.length-1].ty==ty&&ty!='c1'&&ty!='c2')continue;   /* evita dos seguidas del mismo tipo */
    if(ty=='t'){if(ti<th.length){const x=th[ti++],o=shf(x[1].map((t,j)=>[t,j==0]));q={ty,q:x[0],o:o.map(v=>v[0]),c:o.findIndex(v=>v[1]),exp:x[2]}}}
    else if(ty=='z'){if(zi<qz.length){const x=qz[zi++],o=shf(x[2].map((t,j)=>[t,j==0]));q={ty,q:x[1],o:o.map(v=>v[0]),c:o.findIndex(v=>v[1]),exp:x[3]}}}
    else if(ty=='c1'){const[ki,t]=pickA(uA),P=mkPool(ki,t,1+rnd(2));q={ty,ki,ti:t,P,ord:shf(P.map((_,i)=>i))}}
    else if(ty=='i1'){const[ki,t]=pickA(uA);q={ty,ki,ti:t,opts:TA.filter(x=>avail(ki,x))}}
    else if(ty=='c2'){const t=[1,1,0,6][rnd(4)],inv=t==6?0:rnd(TY[t].c.length),[k,d]=pkB(t,uB),P=pool2(k,d,t,2,inv);q={ty,ki:k,d,t,inv,P,ord:shf(P.map((_,i)=>i))}}
    else if(ty=='i2'){const t=[1,0,4,1,6][rnd(5)],inv=t<2?rnd(TY[t].c.length):0,[k,d]=pkB(t,uB);q={ty,ki:k,d,t,inv}}
    else if(ty=='n2'){const[k,d]=pkB(1,uB),j=rnd(4),ns=sd(k,d,1,0),c=ns.find(n=>n.j==j),cn=nn(c),o=new Set([cn]);[sy(c.a+1),sy(c.a-1)].forEach(a=>o.add(NM[c.L]+a));let g=0;while(o.size<4&&g++<60)o.add(NM[rnd(7)]+sy(rnd(3)-1));
      const opts=shf([cn,...[...o].filter(x=>x!=cn).slice(0,3)]);q={ty,ki:k,d,j,opts,c:opts.indexOf(cn)}}
    else if(ty=='f2'){const t=rnd(2),inv=rnd(TY[t].c.length),[k,d]=pkB(t,uB);q={ty,ki:k,d,t,inv,n:TY[t].c.length}}
    if(q)out.push(q)}
  return out}
function qPrompt(q){switch(q.ty){
  case 'c1':return `Construye ${rlab(q.ti)} <span class="sub">(${TY[q.ti].n})</span> en <b>${kn(q.ki)}</b>`;
  case 'i1':return `¿Qué acorde es este en <b>${kn(q.ki)}</b>?`;
  case 'c2':return `Construye ${dl(q.d,q.inv,q.t)} <span class="sub">(${TY[q.t].n}${q.inv?', '+IN[q.inv]:''})</span> en <b>${kn(q.ki)}</b>`;
  case 'i2':return `Este acorde de dominante, en <b>${kn(q.ki)}</b>, ¿de qué grado es dominante?`;
  case 'n2':return `En <b>${kn(q.ki)}</b>, ¿cuál es <b>${BJ[q.j]}</b> de la <b>${dl(q.d,0)}</b>?`;
  case 'f2':return `Este acorde es dominante del <b>${RN[q.d]}</b> en <b>${kn(q.ki)}</b>. ¿Qué cifrado tiene?`;
  default:return q.q}}
function qNotes(q){if(q.ty=='c1'||q.ty=='i1')return chord(q.ki,q.ti);if(q.ty=='c2'||q.ty=='i2'||q.ty=='f2')return sd(q.ki,q.d,q.t,q.inv);return null}
const hasVis=q=>q.ty=='i1'||q.ty=='i2'||q.ty=='f2';
function qOpts(q){switch(q.ty){
  case 'i1':return q.opts.map(t=>rlab(t)+`<small>${TY[t].n}</small>`);
  case 'i2':return [2,3,4,5,6].map(x=>`${RN[x]}<small>${nn(tgt(q.ki,x).T)}</small>`);
  case 'f2':return [...Array(q.n).keys()].map(i=>dl(q.d,i,q.t));
  case 'n2':return q.opts.map(x=>`<span style="font-size:1.3em">${x}</span>`);
  case 't':case 'z':return q.o.map(x=>x.startsWith('<span class="fg"')?`<span class="bigfig">${x}</span>`:x);default:return null}}
function qCorrect(q){switch(q.ty){case 'i1':return q.opts.indexOf(q.ti);case 'i2':return q.d-2;case 'f2':return q.inv;default:return q.c}}
function qExp(q){switch(q.ty){
  case 'c1':return `${rlab(q.ti)} en ${kn(q.ki)}. ${TY[q.ti].t}`;
  case 'i1':return `Era ${rlab(q.ti)} (${TY[q.ti].n}). ${TY[q.ti].t}`;
  case 'c2':case 'i2':case 'f2':return `${dl(q.d,q.inv,q.t)} en ${kn(q.ki)}: <b>${am(sd(q.ki,q.d,q.t,q.inv),q.t,q.inv)}</b>, que resuelve en ${tn(q.ki,q.d)}. ${TXT[q.t]}`;
  case 'n2':{const ns=sd(q.ki,q.d,1,0).slice().sort((a,b)=>a.j-b.j);return `La ${dl(q.d,0)} en ${kn(q.ki)} es ${ns.map(nn).join(' – ')} (${am(ns,1,0)}).`}
  default:return q.exp||''}}
function check(q,a){if(isBuild(q)){if(!Array.isArray(a)||!a.length)return 0;const key=n=>n.L+','+n.a+','+n.s;const g=a.map(i=>q.P[i]).filter(Boolean).map(key).sort().join('|');return g==qNotes(q).map(key).sort().join('|')?1:0}
  return +a===qCorrect(q)?1:0}

function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state!=='running')try{const p=AC.resume();p&&p.catch&&p.catch(()=>{})}catch(e){}return AC}
let OUTG=null;function OUT(){if(OUTG&&OUTG.c===AC)return OUTG.g;const g=AC.createGain();g.gain.value=1.6;try{const c=AC.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=6;g.connect(c);c.connect(AC.destination)}catch(e){g.connect(AC.destination)}OUTG={c:AC,g};return g}
function loadP(){if(SMP.st||!ctx())return;SMP.st=1;try{const s=atob(PSMP.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);AC.decodeAudioData(u.buffer,x=>{SMP.buf=x},()=>{SMP.st=0})}catch(e){SMP.st=0}}
function tone(m,t,d,v){const g=AC.createGain();g.connect(OUT());
  if(SMP.buf){const s=AC.createBufferSource(),dt=(m-72)*100+3,e=Math.min(d,SMP.buf.duration/Math.pow(2,dt/1200));s.buffer=SMP.buf;s.detune.value=dt;v*=.85;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.setValueAtTime(v,t+Math.max(.05,e-.3));g.gain.linearRampToValueAtTime(0,t+e);s.connect(g);s.start(t);s.stop(t+e+.05);return}
  const o=AC.createOscillator();o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);o.start(t);o.stop(t+d)}
function wk(f){const a=ctx();if(!a)return;loadP();if(a.state==='running'){f();return}let d=0;const go=()=>{if(!d){d=1;try{f()}catch(e){}}};try{const p=a.resume();p&&p.then?p.then(go,go):go()}catch(e){go()}setTimeout(go,400)}
function playChord(ns){if(!ns||!ns.length)return;wk(()=>{const t=AC.currentTime+.05;ns.forEach(n=>tone(n.m,t,2.4,.75/Math.sqrt(ns.length)))})}
function playNote(n){wk(()=>tone(n.m,AC.currentTime+.02,1.4,.55))}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ctx();loadP()},{passive:true,capture:true}));

const HINT=300;   /* lo que resta una pista si se acierta */
const streakBonus=s=>s>=3?Math.min(600,(s-1)*100):0;   /* 3 seguidas: +200, 4: +300 … hasta +600 */

function buildHint(q){const ns=qNotes(q),root=ns.find(n=>n.j==0)||ns[0],bass=ns[0];return `La fundamental es <b>${nn(root)}</b> y el acorde tiene <b>${ns.length} notas</b>${bass!==root?`. En el bajo va <b>${nn(bass)}</b>`:''}.`}
function hintHide(q){const n=qOpts(q).length,c=qCorrect(q),w=shf([...Array(n).keys()].filter(i=>i!==c));return w.slice(0,n<=3?1:2)}

/* ---------- conexión: servidor MQTT público por WebSocket seguro (igual que la K9) ---------- */
const BROKERS=[{url:'wss://public.cloud.shiftr.io',username:'public',password:'public'},{url:'wss://broker.hivemq.com:8884/mqtt'},{url:'wss://broker.emqx.io:8084/mqtt'}];
const NS='mgp-concurso-dominantes/';
const T=code=>({host:NS+code+'/pantalla',stu:NS+code+'/moviles'});
function connect(idx,id,onOk,onFail,status,only){
  if(typeof mqtt==='undefined'){onFail('No se ha podido cargar la conexión. Comprueba internet y recarga la página.');return}
  if(idx>=BROKERS.length||(only&&idx>only.max)){onFail('No se ha podido conectar con el servidor de la sala. Puede que la red del centro lo bloquee: prueba con los datos del móvil o con otra wifi.');return}
  status&&status('Conectando con el servidor '+(idx+1)+'…');
  let done=false;const B=BROKERS[idx];const cli=mqtt.connect(B.url,{clientId:id+'-'+idx+'-'+Math.random().toString(36).slice(2,6),clean:true,connectTimeout:6000,reconnectPeriod:2000,keepalive:30,username:B.username,password:B.password});
  const to=setTimeout(()=>{if(!done){done=true;try{cli.end(true)}catch(e){}connect(idx+1,id,onOk,onFail,status,only)}},7000);
  cli.on('connect',()=>{if(done)return;done=true;clearTimeout(to);onOk(cli,idx)});
  cli.on('error',()=>{})}
function qrSVG(text){if(typeof qrcode==='undefined')return '<p style="color:#15282e;margin:8px">No se ha podido cargar el generador del código QR. Usad la dirección y el código de sala.</p>';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+2} ${r+2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="Código QR para entrar en la sala"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
const baseURL=()=>location.href.split('#')[0];

const HK=NS+'sala-profe';
function hSave(){if(!H.code||H.ph=='conn'||H.ph=='fail')return;try{localStorage.setItem(HK,JSON.stringify({at:Date.now(),code:H.code,ph:H.ph,P:[...H.P],qs:H.qs,qi:H.qi,qid:H.qid,qStart:H.qStart||0,tl:H.tl||0,cfg:H.cfg,rej:H.rej,dist:H.dist||[],prevRank:H.prevRank||{},live:H.live,ended:H.ended||0,key:H.key||''}))}catch(e){}}
function hLoadSaved(){try{const s=JSON.parse(localStorage.getItem(HK)||'null');if(s&&s.code&&Date.now()-s.at<6*3600e3)return s}catch(e){}return null}
function hForget(){try{localStorage.removeItem(HK)}catch(e){}}
setInterval(()=>{if(H.cli)hSave()},15000);
const phTxt={lobby:'esperando para empezar',q:'en mitad de una pregunta',reveal:'corrigiendo',rank:'en la clasificación',end:'terminada'};
function resumeCard(){const s=hLoadSaved();if(!s)return '';return `<div class="card resume"><div><p class="eyebrow">Sala abierta</p><h2>Sala ${esc(s.code)} · ${s.P.length} ${s.P.length==1?'alumno':'alumnos'}</h2><p class="muted" style="margin:4px 0 0">${s.qs&&s.qs.length&&s.ph!='lobby'?'Ejercicio '+(s.qi+1)+' de '+s.qs.length+', ':''}${phTxt[s.ph]||''}. Los móviles siguen conectados a ella.</p></div><div class="row"><button class="btn primary big" onclick="hostResume()">Volver a la sala ${esc(s.code)}</button><button class="btn ghost" onclick="hForget();vHome()">Descartarla</button></div></div>`}
function hostResume(){const s=hLoadSaved();if(!s){hostOpen();return}
  Object.assign(H,{code:s.code,ph:'conn',P:new Map(s.P),qs:s.qs||[],qi:s.qi,qid:s.qid,qStart:s.qStart,tl:s.tl,cfg:Object.assign(H.cfg,s.cfg||{}),rej:s.rej||{},dist:s.dist||[],prevRank:s.prevRank||{},ended:s.ended||0,key:s.key||''});if(s.live!=null)H.live=s.live;
  H.msg='Volviendo a la sala '+s.code+'…';hRender();const i=+s.code[0]-1;
  connect(i,myHostId,cli=>{H.cli=cli;cli.subscribe(T(H.code).stu);cli.on('message',hMsg);cli.on('connect',()=>{try{cli.subscribe(T(H.code).stu)}catch(e){}hPubNow()});
    H.ph=s.ph;clearInterval(H.tick);H.tick=setInterval(hTick,250);hRender();hPubNow();toast('Sala '+H.code+' recuperada')},
    err=>{H.msg=err;H.ph='fail';hRender()},m=>{H.msg=m;if(H.ph=='conn')hRender()},{max:i})}
function vHome(){$('#app').innerHTML=`<div class="home">
  <div><p class="eyebrow">Análisis musical · concurso en clase</p><h1>Concurso de armonía</h1></div>
  <p class="lead">Las preguntas salen de los exámenes del acorde de dominante y de las dominantes secundarias, sin los acordes de novena. La pantalla de clase hace la pregunta y cada alumno o alumna responde desde su móvil, solo o por equipos.</p>
  ${resumeCard()}
  <div class="roles">

    <div class="card role"><h2>📱 Soy alumno/a</h2><p>Si has escaneado el QR ya estás aquí. Elige compositor, escribe tu nombre y entra.</p><button class="btn big" onclick="studentStart('')">Entrar con el móvil</button></div>
  </div><div class="row"><button class="btn ghost" onclick="remoteForm()">🔑 Mando del profe</button><span class="muted" style="font-size:.9rem">Para ver en tu móvil la respuesta correcta y controlar la sala.</span></div></div>`}

/* ================= PANTALLA DE CLASE ================= */
const H={cli:null,code:'',ph:'conn',P:new Map(),qs:[],qi:-1,qid:'',qStart:0,tl:0,cfg:{bank:'AB',n:15,mult:1,teams:0},rej:{},tick:null,pubT:null,lastPub:0,dist:[],prevRank:{},msg:''};
const myHostId='h'+Math.random().toString(36).slice(2,9);
function hostOpen(){H.ph='conn';H.msg='Conectando…';hRender();
  connect(0,myHostId,(cli,idx)=>{H.cli=cli;H.code=String(idx+1)+String(100+rnd(900));cli.subscribe(T(H.code).stu);cli.on('message',hMsg);
    cli.on('connect',()=>{try{cli.subscribe(T(H.code).stu)}catch(e){}hPubNow()});
    H.ph='lobby';hPubNow();hRender();clearInterval(H.tick);H.tick=setInterval(hTick,250)},
    err=>{H.msg=err;H.ph='fail';hRender()},s=>{H.msg=s;if(H.ph=='conn')hRender()})}
function rankMap(){const arr=[...H.P].sort((a,b)=>b[1].score-a[1].score);const r={};let last=null,pos=0;arr.forEach(([id,p],i)=>{if(p.score!==last){pos=i+1;last=p.score}r[id]=pos});return r}
function teamSizes(excl){const c=Array(H.cfg.teams).fill(0);H.P.forEach((p,id)=>{if(id!==excl&&p.team!=null&&p.team<H.cfg.teams)c[p.team]++});return c}
function smallestTeam(excl){const c=teamSizes(excl);return c.indexOf(Math.min(...c))}
function fixTeams(){if(!H.cfg.teams)return;H.P.forEach((p,id)=>{if(p.team==null||p.team>=H.cfg.teams)p.team=smallestTeam(id)})}
/* puntos del equipo = media de los puntos de sus miembros (así es justo aunque los equipos sean de distinto tamaño) */
function teamStats(){if(!H.cfg.teams)return [];const t=TEAMS.slice(0,H.cfg.teams).map((x,i)=>({i,c:x[1],m:[],sum:0,gain:0}));
  H.P.forEach(p=>{const X=t[p.team];if(!X)return;X.m.push(p);X.sum+=p.score;X.gain+=(p.last?p.last.pts:0)});
  t.forEach(X=>{X.avg=X.m.length?Math.round(X.sum/X.m.length):0;X.g=X.m.length?Math.round(X.gain/X.m.length):0});
  const act=t.filter(X=>X.m.length).sort((a,b)=>b.avg-a.avg);let last=null,pos=0;act.forEach((X,i)=>{if(X.avg!==last){pos=i+1;last=X.avg}X.pos=pos});return act}
function hPub(){clearTimeout(H.pubT);H.pubT=setTimeout(hPubNow,90)}
function hPubNow(){hSave();if(!H.cli||!H.cli.connected)return;H.lastPub=Date.now();const live=['q','reveal','rank'].includes(H.ph),ranks=rankMap(),shown=['reveal','rank'].includes(H.ph);
  const m={t:'st',ph:H.ph,qi:H.qi,n:H.qs.length,qid:H.qid,q:live?H.qs[H.qi]:null,left:H.ph=='q'?Math.max(0,H.tl-(Date.now()-H.qStart)):0,tl:H.tl,cfg:{teams:H.cfg.teams},
    pl:[...H.P].map(([id,p])=>[id,p.name,p.av,p.score,p.team]),done:H.ph=='q'?[...H.P].filter(([id,p])=>p.ans[H.qid]).map(([id])=>id):[],
    res:['reveal','rank','end'].includes(H.ph)?Object.fromEntries([...H.P].map(([id,p])=>{const l=shown&&p.last?p.last:{};return [id,[l.ok?1:0,l.pts||0,p.score,ranks[id],p.streak,l.answered?1:0,l.hint?1:0,l.bonus||0]]})):null,
    tm:H.cfg.teams?teamStats().map(X=>[X.i,X.avg,X.pos]):null,rej:H.rej,at:Date.now()};
  try{H.cli.publish(T(H.code).host,JSON.stringify(m),{qos:0,retain:true})}catch(e){}}
function hMsg(topic,buf){let m;try{m=JSON.parse(buf.toString())}catch(e){return}if(!m||!m.from)return;const id=String(m.from).slice(0,24);
  if(m.t=='ctl'){if(m.key&&m.key===H.key)hCtl(String(m.cmd));return}
  if(m.t=='hi'){const name=String(m.name||'').trim().slice(0,20)||'Alumno/a',av=AVATARS[m.av]?m.av:ORDER[0];
    const others=[...H.P].filter(([i])=>i!==id);const holder=others.find(([i,p])=>p.av===av);const freeExists=ORDER.some(k=>!others.some(([i,p])=>p.av===k));
    if(holder&&freeExists){H.rej[id]=av;hPub();return}
    delete H.rej[id];let p=H.P.get(id);
    if(p){p.name=name;p.av=av}else{p={name,av,score:0,streak:0,ans:{},last:null,team:null};H.P.set(id,p);toast(`${name} entra como ${avN(av)}`)}
    const wt=Number.isInteger(m.team)?m.team:null;
    if(H.cfg.teams){if(wt!=null&&wt>=0&&wt<H.cfg.teams)p.team=wt;else if(p.team==null||p.team>=H.cfg.teams)p.team=smallestTeam(id)}else if(wt!=null)p.team=wt;
    hPub();hPlayers();return}
  if(m.t=='ans'){const p=H.P.get(id);if(!p||H.ph!=='q'||m.qid!==H.qid||p.ans[H.qid])return;p.ans[H.qid]={a:m.a,t:Date.now()-H.qStart,h:m.h?1:0};hPub();hAnswered();
    if([...H.P.values()].every(x=>x.ans[H.qid]))setTimeout(()=>{if(H.ph=='q')closeQ()},800)}}
function setCfg(k,v){H.cfg[k]=v;if(k=='teams')fixTeams();hRender();hPub()}
function moveP(id){const p=H.P.get(id);if(!p||!H.cfg.teams)return;p.team=((p.team==null?-1:p.team)+1)%H.cfg.teams;hPlayers();hPub()}
function startQuiz(){if(!H.P.size){H.msg='Todavía no hay nadie conectado. Espera a que entren los móviles.';const e=$('#lmsg');if(e)e.textContent=H.msg;return}
  fixTeams();H.qs=genQuiz(H.cfg.bank,H.cfg.n);H.P.forEach(p=>{p.score=0;p.streak=0;p.ans={};p.last=null;p.hist=[]});H.qi=-1;H.ended=0;nextQ()}
function nextQ(){H.qi++;if(H.qi>=H.qs.length){finish();return}const q=H.qs[H.qi];H.ph='q';H.qid='q'+H.qi+'-'+Date.now().toString(36);H.qStart=Date.now();H.tl=Math.round(QT[q.ty]*H.cfg.mult)*1000;H.P.forEach(p=>p.last=null);hRender();hPubNow()}
function hTick(){if(H.ph!=='q')return;const left=Math.max(0,H.tl-(Date.now()-H.qStart)),s=Math.ceil(left/1000);
  const r=$('#ring');if(r){r.querySelector('b').textContent=s>=100?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s;const c=r.querySelector('.rg');if(c)c.style.strokeDashoffset=String(302*(1-left/H.tl));r.classList.toggle('low',s<=5)}
  MUS.urgent=left<=5500;MUS.prog=1-left/H.tl;
  if(left<=0){closeQ();return}if(Date.now()-H.lastPub>4000)hPubNow()}
function closeQ(){if(H.ph!=='q')return;const q=H.qs[H.qi];H.prevRank=rankMap();H.dist=[];
  H.P.forEach(p=>{const a=p.ans[H.qid];const ok=a?check(q,a.a):0;let pts=0,bonus=0;
    if(ok){p.streak++;let base=Math.round(1000*(1-.5*Math.min(1,a.t/H.tl)));if(a.h)base=Math.max(100,base-HINT);bonus=streakBonus(p.streak);pts=base+bonus}else p.streak=0;
    p.score+=pts;p.last={ok,pts,bonus,answered:!!a,hint:a&&a.h};(p.hist=p.hist||[])[H.qi]={ok,pts,answered:!!a,hint:!!(a&&a.h)};if(a&&!isBuild(q))H.dist[+a.a]=(H.dist[+a.a]||0)+1});
  H.ph='reveal';hRender();hPubNow();if(!isBuild(q)&&hasVis(q))setTimeout(()=>playChord(qNotes(q)),900)}
function showRank(){H.ph='rank';hRender();hPubNow()}
function finish(){H.ph='end';hRender();hPubNow()}
function backLobby(){H.ph='lobby';H.qs=[];H.qi=-1;H.qid='';H.ended=0;H.P.forEach(p=>{p.score=0;p.streak=0;p.ans={};p.last=null;p.hist=[]});hRender();hPubNow()}
function closeRoom(){hForget();musStop();MUS.ph=null;clearInterval(H.tick);try{H.cli.publish(T(H.code).host,'',{retain:true});setTimeout(()=>{try{H.cli.end(true)}catch(e){}},400)}catch(e){}H.cli=null;H.P.clear();H.ph='conn';location.hash='';vHome()}
function hearQ(){const q=H.qs[H.qi];if(q)playChord(qNotes(q))}
const joinURL=()=>baseURL()+'#c'+H.code;
const chip=(id,p,mv)=>`<span class="pchip"${mv?` role="button" tabindex="0" title="Cambiar de equipo" onclick="moveP('${id}')"`:''}>${avSVG(p.av,40)}<span>${esc(p.name)}<br><small>${esc(avN(p.av))}</small></span></span>`;
function playersHTML(){if(!H.P.size)return '<span class="empty">Esperando a que entren los móviles…</span>';
  if(!H.cfg.teams)return [...H.P].map(([id,p])=>chip(id,p,0)).join('');
  return `<div class="teams">${TEAMS.slice(0,H.cfg.teams).map((t,i)=>{const ms=[...H.P].filter(([id,p])=>p.team===i);return `<div class="team" style="--tc:${t[1]}"><h3>${tN(i)} <small>${ms.length}</small></h3>${ms.map(([id,p])=>chip(id,p,1)).join('')||'<span class="empty">Nadie todavía</span>'}</div>`}).join('')}</div><small class="muted">Toca a una persona para pasarla al equipo siguiente.</small>`}

    ${vis?`<div class="paper qvis">${vis}</div>`:''}
    ${isBuild(q)?'<p class="buildnote">📱 Construid el acorde en el móvil y pulsad «Enviar»</p>':tilesHTML(q,false)}
    <div class="qfoot"><div class="answered" id="answered"></div><span class="grow"></span>${hasVis(q)?'<button class="btn" onclick="hearQ()">🔊 Escuchar el acorde</button>':''}<button class="btn" onclick="closeQ()">Cerrar la pregunta</button></div><p class="muted" id="nowp" style="margin:10px 0 0;font-size:.9rem"></p>`;

    <div class="qfoot"><span class="answered"><b>${right.length}</b><span>${right.length==1?'acierto':'aciertos'}${hints?` · 💡 ${hints} ${hints==1?'ha pedido pista':'han pedido pista'}`:''}</span></span><span class="grow"></span>${(hasVis(q)||isBuild(q))?'<button class="btn" onclick="hearQ()">🔊 Escuchar</button>':''}<button class="btn primary big" onclick="showRank()">Clasificación ▶</button></div>`;return}
  if(H.ph=='rank'){const now=rankMap(),last=H.qi+1>=H.qs.length,nextB=`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary big" onclick="${last?'finish()':'nextQ()'}">${last?'Ver el podio 🏆':'Siguiente pregunta ▶'}</button></div>`;
    if(H.cfg.teams){const ts=teamStats(),best=[...H.P.values()].sort((a,b)=>b.score-a.score).slice(0,3);
      A.innerHTML=fs+qbar(q)+`<div class="rank"><h1>Clasificación por equipos</h1>${ts.map((X,i)=>`<div class="rrow trow ${X.pos==1?'top1':''}" style="--tc:${X.c};animation-delay:${i*.06}s"><span class="pos">${X.pos}</span>${tmAvs(X,38)}<span class="nm">${tN(X.i)}<small>${X.m.map(p=>esc(p.name)).join(', ')}</small></span><span class="dl">${X.g?'+'+X.g:''}</span><span class="sc">${X.avg}</span></div>`).join('')}
        <p class="muted" style="text-align:center;margin:6px 0 0">Mejores puntuaciones individuales: ${best.map(p=>`<b>${esc(p.name)}</b> ${p.score}${p.streak>=3?' 🔥'+p.streak:''}`).join(' · ')}</p>${nextB}<p class="muted" id="nowp" style="text-align:center"></p></div>`;return}
    const arr=[...H.P].sort((a,b)=>b[1].score-a[1].score).slice(0,10);
    A.innerHTML=fs+qbar(q)+`<div class="rank"><h1>Clasificación</h1>${arr.length?arr.map(([id,p],i)=>{const pr=H.prevRank[id],mv=pr&&H.qi>0?pr-now[id]:0;
      return `<div class="rrow ${now[id]==1?'top1':''}" style="animation-delay:${i*.06}s"><span class="pos">${now[id]}</span>${avSVG(p.av,46)}<span class="nm">${esc(p.name)}${p.streak>1?` <span title="Aciertos seguidos">🔥${p.streak}</span>`:''}<small>${esc(avN(p.av))}${mv>0?`<span class="mv up">▲${mv}</span>`:mv<0?`<span class="mv dn">▼${-mv}</span>`:''}</small></span><span class="dl">${p.last&&p.last.pts?'+'+p.last.pts:''}${p.last&&p.last.bonus?`<small class="bn">racha +${p.last.bonus}</small>`:''}</span><span class="sc">${p.score}</span></div>`}).join(''):'<p class="empty">No hay nadie conectado.</p>'}${nextB}<p class="muted" id="nowp" style="text-align:center"></p></div>`;return}
  if(H.ph=='end'){const cols=['#d9443c','#2c6ed4','#f4a53a','#22935a','#8a52c6','#ffffff'];
    let conf='';for(let i=0;i<110;i++)conf+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*2.5).toFixed(2)}s;animation-duration:${(2.8+Math.random()*2.4).toFixed(2)}s"></i>`;
    const btns=`<div class="row" style="justify-content:center"><button class="btn big" onclick="exportXLSX()">📊 Exportar a Excel</button><button class="btn primary big" onclick="backLobby()">Nuevo concurso</button><button class="btn ghost" onclick="closeRoom()">Cerrar la sala</button></div>`;
    const arr=[...H.P].sort((a,b)=>b[1].score-a[1].score);
    if(H.cfg.teams){const ts=teamStats(),top=ts.slice(0,3);
      const pd=(X,n)=>X?`<div class="pd p${n}"><div class="pdav">${tmAvs(X,n==1?64:48)}</div><b>${tN(X.i)}</b><span>${X.avg} puntos</span><div class="pdbox" style="background:${X.c};color:#fff">${n}.º</div></div>`:'<div class="pd"></div>';
      A.innerHTML=fs+`<div class="conf">${conf}</div><div class="end"><p class="eyebrow">Fin del concurso${H.ended&&H.ended<H.qs.length?` · ${H.ended} de ${H.qs.length} preguntas`:''}</p><h1>🏆 ¡Gana el ${top[0]?tN(top[0].i):'…'}!</h1>
        <div class="pdrow">${pd(top[1],2)}${pd(top[0],1)}${pd(top[2],3)}</div>
        <div class="rank" style="width:100%">${ts.slice(3).map(X=>`<div class="rrow trow" style="--tc:${X.c}"><span class="pos">${X.pos}</span>${tmAvs(X,32)}<span class="nm">${tN(X.i)}</span><span class="dl"></span><span class="sc">${X.avg}</span></div>`).join('')}
        ${arr[0]?`<p style="text-align:center;margin:8px 0 0">🏅 Mejor puntuación individual: <b>${esc(arr[0][1].name)}</b> (${esc(avN(arr[0][1].av))}), ${arr[0][1].score} puntos</p>`:''}</div>${btns}</div>`;return}
    const top=arr.slice(0,3).map(x=>x[1]);
    const pd=(p,n)=>p?`<div class="pd p${n}"><div class="pdav">${avSVG(p.av,n==1?150:108)}</div><b>${esc(p.name)}</b><span>${p.score} puntos</span><div class="pdbox">${n}.º</div></div>`:'<div class="pd"></div>';
    A.innerHTML=fs+`<div class="conf">${conf}</div><div class="end"><p class="eyebrow">Fin del concurso${H.ended&&H.ended<H.qs.length?` · ${H.ended} de ${H.qs.length} preguntas`:''}</p><h1>🏆 ¡Enhorabuena!</h1>
      <div class="pdrow">${pd(top[1],2)}${pd(top[0],1)}${pd(top[2],3)}</div>
      <div class="rank" style="width:100%">${arr.slice(3).map(([id,p],i)=>`<div class="rrow"><span class="pos">${i+4}</span>${avSVG(p.av,40)}<span class="nm">${esc(p.name)}<small>${esc(avN(p.av))}</small></span><span class="dl"></span><span class="sc">${p.score}</span></div>`).join('')}</div>${btns}</div>`;

/* QR para quien llega tarde: se puede mostrar en cualquier momento */
function showQR(){let o=$('#qrov');if(o){o.remove();return}o=document.createElement('div');o.id='qrov';o.className='qrov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Código QR para entrar');
  o.innerHTML=`<div class="card join"><p class="eyebrow">¿Llegas tarde? Entra con el móvil</p><div class="qr">${qrSVG(joinURL())}</div><p class="url">${esc(joinURL().replace(/^https?:\/\//,''))}</p><div class="bigcode">${H.code}</div><button class="btn primary" onclick="showQR()">Cerrar</button></div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
const FSE=()=>document.fullscreenElement||document.webkitFullscreenElement;
function togFS(){const d=document.documentElement;try{if(FSE()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}const rq=d.requestFullscreen||d.webkitRequestFullscreen;if(!rq){toast('Prueba con la tecla F11.');return}const r=rq.call(d);r&&r.catch&&r.catch(()=>toast('Prueba con la tecla F11.'))}catch(e){toast('Prueba con la tecla F11.')}}

/* ================= MÓVIL DEL ALUMNADO ================= */
const SK='cdom-alumno';
const S={cli:null,code:'',id:'',name:'',av:null,team:null,st:null,key:'',qid:null,sent:false,pl:{},deadline:0,joined:false,joining:false,msg:'',taken:new Set(),found:false,tm:null,out:false,hint:false,hide:[]};
function sLoad(){try{return JSON.parse(sessionStorage.getItem(SK)||'null')}catch(e){return null}}
function sSave(){try{sessionStorage.setItem(SK,JSON.stringify({id:S.id,name:S.name,av:S.av,code:S.code,team:S.team,joined:S.joined,qid:S.qid,pl:S.pl,hint:S.hint,hide:S.hide}))}catch(e){}}
function studentStart(code){document.body.classList.remove('host');const sv=sLoad();S.id=(sv&&sv.id)||'a'+Math.random().toString(36).slice(2,10);
  if(sv){S.name=sv.name||'';if(AVATARS[sv.av])S.av=sv.av;if(Number.isInteger(sv.team))S.team=sv.team}if(!S.av)S.av=ORDER[rnd(ORDER.length)];S.code=code||(sv&&sv.code)||'';
  if(sv&&sv.joined&&/^[1-3]\d{3}$/.test(sv.code)&&(!code||code===sv.code)){S.code=sv.code;S.qid=sv.qid||null;S.pl=sv.pl||{};S.hint=!!sv.hint;S.hide=sv.hide||[];if(sv.sel!=null)S.sel=sv.sel;S.restored=true;
    $('#app').innerHTML=`<div class="phone"><div class="state"><div class="wiggle">${avSVG(S.av,110)}</div><h2>Volviendo a la sala ${esc(S.code)}…</h2><p class="muted" style="margin:0">Eres ${esc(S.name)}. Conservas tus puntos.</p></div></div>`;
    sConnect(S.code,()=>{S.joining=true;sPub({t:'hi',name:S.name,av:S.av,team:S.team});setTimeout(()=>{if(!S.joined){S.joining=false;S.msg='No se ha podido volver a entrar. Revisa el código y pulsa «Unirme».';vJoin()}},7000)},err=>{S.msg=err;vJoin()});clearInterval(S.tm);S.tm=setInterval(sTick,250);return}
  vJoin();if(/^[1-3]\d{3}$/.test(S.code))sConnect(S.code,()=>{},()=>{});
  clearInterval(S.tm);S.tm=setInterval(sTick,250)}
function sConnect(code,ok,fail){if(S.cli&&S.cliCode===code&&S.cli.connected){ok();return}
  try{S.cli&&S.cli.end(true)}catch(e){}S.cli=null;S.found=false;S.cliCode=code;const i=+code[0]-1;
  connect(i,S.id,cli=>{S.cli=cli;cli.subscribe(T(code).host);cli.on('message',(t,b)=>{const s=b.toString();if(!s){if(S.joined){S.joined=false;S.msg='El profe ha cerrado la sala.';vJoin()}return}let m;try{m=JSON.parse(s)}catch(e){return}if(m.t==='st'){S.found=true;sOnState(m)}});
    cli.on('connect',()=>{try{cli.subscribe(T(code).host)}catch(e){}if(S.joined)sPub({t:'hi',name:S.name,av:S.av,team:S.team})});ok()},fail,null,{max:i})}
function sPub(o){if(S.cli&&S.cli.connected)S.cli.publish(T(S.cliCode).stu,JSON.stringify(Object.assign({from:S.id},o)),{qos:0})}
function sMsg(t){S.msg=t;const e=$('#smsg');if(e)e.textContent=t}
const nTeams=()=>(S.st&&S.st.cfg&&S.st.cfg.teams)||0;
function sJoin(){const n=$('#s-name'),c=$('#s-code');S.name=(n&&n.value.trim())||'';const code=(c&&c.value.trim())||S.code;
  if(!S.name){sMsg('Escribe tu nombre.');n&&n.focus();return}
  if(!/^[1-3]\d{3}$/.test(code)){sMsg('Escribe el código de 4 cifras que aparece en la pantalla de clase.');return}
  if(S.taken.has(S.av)&&ORDER.some(k=>!S.taken.has(k))){sMsg(avN(S.av)+' ya lo tiene otra persona. Elige otro compositor.');return}
  if(nTeams()&&(S.team==null||S.team>=nTeams())){sMsg('Elige tu equipo.');return}
  S.code=code;S.joining=true;sMsg('Entrando en la sala '+code+'…');const b=$('#s-join');if(b)b.disabled=true;
  sConnect(code,()=>{sPub({t:'hi',name:S.name,av:S.av,team:S.team});setTimeout(()=>{if(!S.joined&&S.joining){S.joining=false;const b=$('#s-join');if(b)b.disabled=false;sMsg(S.found?'La pantalla de clase no responde. Vuelve a pulsar «Unirme».':'No se encuentra la sala '+code+'. Revisa el código y que la pantalla de clase tenga la sala abierta.')}},6500)},
    err=>{S.joining=false;const b=$('#s-join');if(b)b.disabled=false;sMsg(err)})}
function sOnState(m){S.st=m;S.taken=new Set(m.pl.filter(x=>x[0]!==S.id).map(x=>x[2]));
  if(m.rej&&m.rej[S.id]&&!S.joined){if(S.joining){S.joining=false;sMsg(avN(m.rej[S.id])+' ya lo ha elegido otra persona. Elige otro compositor y pulsa «Unirme».');const b=$('#s-join');if(b)b.disabled=false}drawPick();drawTeams();return}
  const me=m.pl.find(x=>x[0]===S.id);
  if(!me){if(S.joined){S.joined=false;vJoin()}else{drawPick();drawTeams()}return}
  if(!S.joined){S.joined=true;S.joining=false;S.av=me[2];toast('¡Dentro! Mira la pantalla de clase.')}
  if(me[4]!=null)S.team=me[4];sSave();
  if(S.restored&&m.ph=='q'&&m.qid===S.qid){S.deadline=Date.now()+m.left;S.restored=false}
  if(m.ph=='q'&&m.qid!==S.qid){S.restored=false;S.qid=m.qid;S.sent=false;S.pl={};S.out=false;S.hint=false;S.hide=[];S.deadline=Date.now()+m.left}
  if(m.ph=='q'&&m.done.includes(S.id))S.sent=true;
  const key=[m.ph,m.qid,S.sent,S.out,nTeams()?S.team:''].join('|');
  if(key!==S.key){S.key=key;sRender()}else if(m.ph=='lobby'){const e=$('#wcount');if(e)e.textContent=m.pl.length}}
function sTick(){if(!S.joined||!S.st||S.st.ph!=='q'||S.sent)return;const left=S.deadline-Date.now(),f=Math.max(0,left/(S.st.tl||1));const b=$('#ptimer');if(b)b.style.width=(100*f)+'%';
  if(left<=0&&!S.out){S.out=true;S.key='';sOnState(S.st)}}
function drawPick(){const box=$('#s-av');if(!box)return;const all=!ORDER.some(k=>!S.taken.has(k));
  box.innerHTML=ORDER.map(k=>{const tk=S.taken.has(k)&&!all;return `<button type="button" role="radio" aria-checked="${k===S.av}" data-av="${k}" class="${tk?'taken':''}" title="${esc(avN(k))}${tk?' (ya elegido)':''}" aria-label="${esc(avN(k))}${tk?', ya elegido':''}">${avSVG(k,44)}${tk?'<i class="lk">🔒</i>':''}</button>`}).join('');
  const n=$('#s-avname');if(n)n.textContent='· '+avN(S.av)}
function drawTeams(){const box=$('#s-teams');if(!box)return;const n=nTeams();box.hidden=!n;if(!n)return;
  const cnt=Array(n).fill(0);S.st.pl.forEach(x=>{if(x[0]!==S.id&&x[4]!=null&&x[4]<n)cnt[x[4]]++});
  box.innerHTML=`<span class="lbl">Elige tu equipo</span><div class="tpick" role="radiogroup" aria-label="Equipo">${TEAMS.slice(0,n).map((t,i)=>`<button type="button" role="radio" aria-checked="${S.team===i}" style="--tc:${t[1]}" onclick="S.team=${i};drawTeams()">${t[0]}<small>${cnt[i]} ${cnt[i]==1?'persona':'personas'}</small></button>`).join('')}</div>`}
function avCard(anim){const card=$('#s-card');if(!card)return;const k=S.av,f=INFO[k]||['',''];
  card.innerHTML=`<div class="avbig">${avSVG(k,76)}</div><div><b>${esc(avN(k))}</b><small>${f[0]}</small><p>${f[1]}</p></div>`;

/* ================= música de concurso: adaptaciones de obras clásicas =================
   Instrumentos: muestras reales de piano y de cuerda (las del examen de dominantes secundarias) + percusión sintetizada + reverberación de sala.
   Espera y clasificación: popurrí de 7 obras, una detrás de otra.
   Mientras se responde: una obra distinta en cada pregunta (6 que van rotando); acelera con la cuenta atrás y en los últimos segundos entra «El vuelo del moscardón». */
const MUS={on:true,cur:null,timer:null,next:0,step:0,g:null,ph:null,urgent:false,prog:0,noise:null,li:0,si:0,piece:null,rev:null};

function loadS(){for(const k in SAMP){const S=SAMP[k];if(S.st||!ctx())continue;S.st=1;try{const s=atob(S.src.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);AC.decodeAudioData(u.buffer,x=>{S.buf=x},()=>{S.st=0})}catch(e){S.st=0}}}
function sp(k,m,t,d,v,dest){const S=SAMP[k];if(!S.buf){osc(m,t,d,k=='v'?'sawtooth':'triangle',v*.35,dest,k=='v'?2200:3000);return}
  const s=AC.createBufferSource(),g=AC.createGain(),dt=(m-72)*100+S.det,e=Math.max(.08,Math.min(d,S.buf.duration/Math.pow(2,dt/1200)-.02)),a=Math.min(S.att,e/3);v*=S.vol;
  s.buffer=S.buf;s.detune.value=dt;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a+.02,e-Math.min(S.rel,e/2)));g.gain.linearRampToValueAtTime(0,t+e);
  s.connect(g);g.connect(dest);s.start(t);s.stop(t+e+.05)}
function noiseBuf(){if(MUS.noise&&MUS.noise.c===AC)return MUS.noise.b;const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise={c:AC,b};return b}
function osc(m,t,d,type,v,dest,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mf(m);let n=o;if(cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f}
  n.connect(g);g.connect(dest);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o.stop(t+d+.02)}
function kick(t,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.27)}
function hiss(t,d,v,dest,type,freq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf();f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.02)}

function room(){if(MUS.rev&&MUS.rev.c===AC)return MUS.rev.n;const c=AC.createConvolver(),L=AC.sampleRate*2.2,b=AC.createBuffer(2,L,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}c.buffer=b;const w=AC.createGain();w.gain.value=.12;c.connect(w);w.connect(AC.destination);MUS.rev={c:AC,n:c};return c}

function sheetXML(rows,w){const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=colL(ci)+(ri+1),st=ri==0?' s="1"':'';return typeof v=='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v==null?'':v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`}
function makeXLSX(sheets){const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',P='http://schemas.openxmlformats.org/package/2006';
  const f=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${P}/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${P}/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>${sheets.map(([n],i)=>`<sheet name="${xe(n).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${P}/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF123843"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`]];
  sheets.forEach(([n,rows,w],i)=>f.push([`xl/worksheets/sheet${i+1}.xml`,sheetXML(rows,w)]));return zipStore(f)}
function fileName(){const d=new Date(),z=x=>String(x).padStart(2,'0');return `${document.title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')}_${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`}
function exportXLSX(){if(!H.P.size){toast('No hay nadie en la sala.');return}const fn=fileName()+'.xlsx',blob=makeXLSX(buildSheets());window.__lastXLSX=blob;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Excel descargado: '+fn)}
const confetti=()=>{const cols=['#d9443c','#2c6ed4','#f4a53a','#22935a','#8a52c6','#ffffff'];let c='';for(let i=0;i<110;i++)c+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*2.5).toFixed(2)}s;animation-duration:${(2.8+Math.random()*2.4).toFixed(2)}s"></i>`;return `<div class="conf">${c}</div>`};

/* ================= MÓVIL DEL PROFE (mando): ve la respuesta correcta antes de corregir y controla la sala ================= */
function hKey(){if(!H.key)H.key=Math.random().toString(36).slice(2,8);return H.key}
const remoteURL=()=>baseURL()+'#p'+H.code+'-'+hKey();
function showRemote(){let o=$('#qrov');if(o){o.remove();return}o=document.createElement('div');o.id='qrov';o.className='qrov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Móvil del profe');
  o.innerHTML=`<div class="card join"><p class="eyebrow">🔑 Móvil del profe</p><p style="margin:0">Con este QR tu móvil ve la respuesta correcta de cada pregunta y puede corregir, pasar a la siguiente y terminar.</p>
    <div class="qr blurred" id="rqr">${qrSVG(remoteURL())}<button class="btn primary" onclick="this.parentNode.classList.remove('blurred');document.getElementById('rkey').hidden=false;this.remove()">Mostrar el QR y la clave</button></div>
    <p class="warn" style="margin:0">Los alumnos no deben verlo: congela o apaga el proyector antes de pulsar «Mostrar».</p>
    <p class="muted" id="rkey" hidden style="margin:0">También puedes entrar en la página desde tu móvil, pulsar «🔑 Mando del profe» y escribir:<br>sala <b>${H.code}</b> · clave <b class="mono">${hKey()}</b></p>
    <button class="btn" onclick="showRemote()">Cerrar</button></div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o)}
const remoteBtn=()=>H.code&&H.ph!='conn'&&H.ph!='fail'?`<button class="btn ghost" onclick="showRemote()">🔑 Móvil del profe</button>`:'';
function endDo(){if(!['q','reveal','rank'].includes(H.ph))return;if(H.ph=='q'){if(typeof closeQ=='function')closeQ();else correct()}H.ended=H.qi+1;finish()}
function hCtl(c){const last=H.qi+1>=H.qs.length,cq=typeof closeQ=='function';
  if(c=='start'&&H.ph=='lobby')startQuiz();
  else if(c=='close'&&H.ph=='q'){cq?closeQ():correct()}
  else if(c=='next'){if(H.ph=='reveal'){if(cq)showRank();else last?finish():nextQ()}else if(H.ph=='rank')last?finish():nextQ()}
  else if(c=='end')endDo();
  else if(c=='hear')hearQ()}

/* ---- la vista del mando en el móvil ---- */
const RM={cli:null,code:'',key:'',st:null,arm:0,tm:null};
function remoteForm(msg){document.body.classList.remove('host');$('#app').innerHTML=`<div class="phone"><div><p class="eyebrow">${esc(document.title)}</p><h1>🔑 Mando del profe</h1></div>
  <div class="card" style="display:grid;gap:14px"><p class="muted" style="margin:0">En la pantalla de clase, pulsa «🔑 Móvil del profe» para ver el código de la sala y la clave.</p>
  <div class="field"><label for="r-code">Código de la sala</label><input id="r-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 cifras"></div>
  <div class="field"><label for="r-key">Clave del profe</label><input id="r-key" maxlength="8" autocomplete="off" autocapitalize="off" placeholder="6 letras o números"></div>
  <p class="msg" id="rmsg">${esc(msg||'')}</p><button class="btn primary big" onclick="remoteGo()">Entrar</button><button class="btn ghost" onclick="vHome()">Volver</button></div></div>`}
function remoteGo(){const c=$('#r-code').value.trim(),k=$('#r-key').value.trim().toLowerCase();if(!/^[1-3]\d{3}$/.test(c)){$('#rmsg').textContent='Escribe el código de 4 cifras.';return}if(!/^[a-z0-9]{4,8}$/.test(k)){$('#rmsg').textContent='Escribe la clave que aparece en la pantalla de clase.';return}
  location.hash='p'+c+'-'+k;remoteStart(c,k)}
function remoteStart(code,key){document.body.classList.remove('host');RM.code=code;RM.key=key;$('#app').innerHTML=`<div class="phone"><div class="state"><h2>Conectando el mando…</h2></div></div>`;
  const i=+code[0]-1;connect(i,'p'+Math.random().toString(36).slice(2,8),cli=>{RM.cli=cli;cli.subscribe(T(code).host);
    cli.on('message',(t,b)=>{const s=b.toString();if(!s){RM.st=null;rRender();return}let m;try{m=JSON.parse(s)}catch(e){return}if(m.t==='st'){RM.st=m;rRender()}});
    cli.on('connect',()=>{try{cli.subscribe(T(code).host)}catch(e){}});
    setTimeout(()=>{if(!RM.st)$('#app').innerHTML=`<div class="phone"><div class="state"><h2>No se encuentra la sala ${esc(code)}</h2><p class="muted" style="margin:0">Comprueba que la pantalla de clase tiene la sala abierta.</p><button class="btn" onclick="remoteForm()">Escribir el código</button></div></div>`},6500)},
    err=>remoteForm(err),null,{max:i})}
function rCmd(c){if(c=='end'&&!RM.arm){RM.arm=1;const b=$('#rend');if(b){b.textContent='¿Terminar ya? Pulsa otra vez';b.classList.add('arm')}setTimeout(()=>{RM.arm=0;const b=$('#rend');if(b){b.textContent='⏹ Terminar';b.classList.remove('arm')}},3500);return}
  RM.arm=0;if(RM.cli&&RM.cli.connected){RM.cli.publish(T(RM.code).stu,JSON.stringify({t:'ctl',from:'profe',key:RM.key,cmd:c}),{qos:0});if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}else toast('Sin conexión con la sala. Espera un momento.')}
function rRender(){const m=RM.st,A=$('#app');let h=`<div class="ptop"><span>🔑 Mando · Sala ${esc(RM.code)}</span><span>${m&&m.n&&m.ph!='lobby'?(m.ph=='end'?'Final':'Pregunta '+(m.qi+1)+' / '+m.n):''}</span></div>`;
  if(!m){A.innerHTML=`<div class="phone">${h}<div class="state"><h2>La sala está cerrada</h2></div></div>`;return}
  const q=m.q,names=id=>{const p=m.pl.find(x=>x[0]===id);return p?p[1]:''},endB=`<button class="btn ghost" id="rend" onclick="rCmd('end')">⏹ Terminar</button>`;
  if(m.ph=='lobby')h+=`<div class="state"><h2>${m.pl.length} ${m.pl.length==1?'persona conectada':'personas conectadas'}</h2><p class="muted" style="margin:0">${m.pl.map(x=>esc(x[1])).join(', ')||'Esperando a que entren los móviles…'}</p><button class="btn primary big" onclick="rCmd('start')">Empezar ▶</button></div>`;
  else if(q&&(m.ph=='q'||m.ph=='reveal'||m.ph=='rank')){const c=qCorrect(q),miss=m.pl.filter(x=>!m.done.includes(x[0])).map(x=>x[1]),right=m.res?Object.values(m.res).filter(r=>r[0]).length:0;
    h+=`<p class="pprompt">${qPrompt(q)}</p><div class="answerbox"><p class="eyebrow" style="margin:0">✅ Respuesta correcta</p>
      <div class="paper">${stf(qNotes(q),q.ki,1)}</div>
      ${isBuild(q)?`<p class="big-ans">${qNotes(q).slice().sort((a,b)=>a.s-b.s).map(nn).join(' – ')}</p>`:`<div class="tile t${c%6}"><i class="shp">${SHAPES[c%6]}</i><span>${qOpts(q)[c]}</span></div>`}
      <p class="muted" style="margin:0;font-size:.95rem">${qExp(q)}</p></div>`;
    if(m.ph=='q')h+=`<p style="margin:0"><b>${m.done.length}</b> de ${m.pl.length} han respondido${miss.length?`<br><span class="muted">Faltan: ${miss.map(esc).join(', ')}</span>`:''}</p>
      <div class="row"><button class="btn primary big grow" onclick="rCmd('close')">${typeof closeQ=='function'?'Cerrar y corregir ✔':'Corregir ✔'}</button><button class="btn" onclick="rCmd('hear')">🔊</button>${endB}</div>`;
    else h+=`<p style="margin:0"><b>${right}</b> de ${m.pl.length} ${right==1?'ha acertado':'han acertado'}</p><div class="row"><button class="btn primary big grow" onclick="rCmd('next')">${m.ph=='reveal'&&typeof closeQ=='function'?'Clasificación ▶':m.qi+1>=m.n?'Ver el podio 🏆':'Siguiente ▶'}</button>${endB}</div>`}
  else if(m.ph=='end'){const top=m.pl.slice().sort((a,b)=>b[3]-a[3]).slice(0,5);h+=`<div class="state"><h2>🏆 Fin</h2>${top.map((x,i)=>`<p style="margin:0">${i+1}.º <b>${esc(x[1])}</b> · ${x[3]} puntos</p>`).join('')}<p class="muted" style="margin:0">Para exportar a Excel o empezar otra ronda, usa la pantalla de clase.</p></div>`}
  A.innerHTML=`<div class="phone">${h}</div>`}

</script>
